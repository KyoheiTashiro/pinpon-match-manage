name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      # カバレッジ付きでテスト実行。vitest.config.ts の threshold 未達で失敗(後退検知)
      - run: npm run test:coverage
      # tsc --noEmit + vite build（型チェックと本番ビルドの両方を兼ねる）
      - run: npm run build
