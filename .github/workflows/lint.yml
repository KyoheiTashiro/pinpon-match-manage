name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --type-aware は通常ルールに加え no-floating-promises 等の型ルールも走らせる
      # --format=github で ::error file=...,line=... を出力し、PR の Files changed に該当行へ
      # インライン注釈を表示する（どのコードで起きているか一目で分かる）
      - run: npm run lint:typed -- --format=github
