name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --type-aware は通常ルールに加え no-floating-promises 等の型ルールも走らせる
      - run: npm run lint:typed
      - run: npm run format:check
